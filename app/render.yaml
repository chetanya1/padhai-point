# Deployment blueprint for an independent Render deployment.
# The current source is a Cloudflare Worker build; it must be switched to the
# TanStack Start + Nitro Node preset before deploying this blueprint.
services:
  - type: web
    name: padhai-point
    runtime: node
    plan: free
    rootDir: .
    buildCommand: echo "Configure TanStack Start Nitro for Render before deploying"
    startCommand: echo "Missing Node/Nitro deployment adapter; see README-RENDER.md"
